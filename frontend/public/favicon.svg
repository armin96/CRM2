<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#fav-grad)" filter="url(#glow)" />
  <g transform="translate(10, 10)">
    <!-- Top prism face -->
    <polygon points="22,4 40,14 22,24 4,14" fill="#ffffff" fill-opacity="0.95" />
    <!-- Bottom layer lines -->
    <path d="M4 34 L22 44 L40 34" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M4 24 L22 34 L40 24" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85" />
    <!-- Core dot -->
    <circle cx="22" cy="24" r="3" fill="#38bdf8" />
  </g>
</svg>