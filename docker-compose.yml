version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: minicrm-db
    environment:
      POSTGRES_DB: minicrm
      POSTGRES_USER: minicrm
      POSTGRES_PASSWORD: minicrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicrm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minicrm-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/minicrm
      DB_USERNAME: minicrm
      DB_PASSWORD: minicrm
      JWT_SECRET: change-this-in-production-use-a-long-random-secret-key
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minicrm-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
