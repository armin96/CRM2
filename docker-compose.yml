services:
  postgres:
    image: postgres:16-alpine
    container_name: minicrm-db
    environment:
      POSTGRES_DB: minicrm
      POSTGRES_USER: minicrm
      POSTGRES_PASSWORD: minicrm_secure_password_nexora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicrm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minicrm-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/minicrm
      DB_USERNAME: minicrm
      DB_PASSWORD: minicrm_secure_password_nexora
      JWT_SECRET: nexora-crm-production-jwt-secret-key-minimum-256-bits-length-guaranteed
      JAVA_OPTS: "-Xmx256m -Xms128m"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minicrm-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:80"
    restart: unless-stopped

volumes:
  pgdata:
