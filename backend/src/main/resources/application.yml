spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/minicrm}
    username: ${DB_USERNAME:minicrm}
    password: ${DB_PASSWORD:minicrm}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:minicrm-super-secret-key-that-is-at-least-256-bits-long-for-HS256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

logging:
  level:
    com.minicrm: DEBUG
    org.springframework.security: INFO
